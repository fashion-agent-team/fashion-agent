name: fashion_agent
description: 시각장애인을 위한 날씨 기반 패션 색 조합 추천 앱
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  flutter_tts: ^4.0.2
  geolocator: ^13.0.1
  http: ^1.2.2
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  firebase_core: ^4.15.2
  firebase_auth: ^6.7.1
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.2.0
  image: ^4.12.0
  # 폰 안에서 옷(물체)·몸(자세)을 찾아 구도 안내. 사진은 밖으로 안 보냄. iOS 15.5 이상 필요.
  google_mlkit_object_detection: ^1.0.0
  google_mlkit_pose_detection: ^1.0.0
  wakelock_plus: ^1.8.2
  google_mlkit_face_detection: ^1.0.0
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  record: ^7.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
