openapi: 3.0.3
info:
  title: Fashion Agent API (앱 ↔ 게이트웨이)
  version: 0.1.0
  description: |
    앱이 부르는 곳은 게이트웨이 하나뿐입니다. 공통 규칙·오류 모양은 contracts/README.md를 보세요.
    사진은 JPEG base64, 시간은 ISO-8601(+09:00), 사람에게 읽어 줄 문장은 한국어입니다.
servers:
  - url: http://localhost:8080
    description: 로컬 / Docker Compose
security:
  - bearer: []
tags:
  - name: auth
  - name: profile
  - name: agent
  - name: schedule
  - name: helper

paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Firebase ID 토큰으로 로그인 (Apple·구글)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string, description: Firebase ID 토큰 }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/auth/dev:
    post:
      tags: [auth]
      summary: 개발용 로그인 (APP_ENV=dev에서만)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string, example: "sim-iphone-15" }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: 액세스 토큰 갱신
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/me/profile:
    get:
      tags: [profile]
      summary: 내 회원정보 (온보딩에서 받은 값)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
    put:
      tags: [profile]
      summary: 회원정보 저장 (건너뛴 항목은 null)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Profile' }
      responses:
        '200':
          description: 저장된 값
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }

  /api/v1/me/push-token:
    put:
      tags: [profile]
      summary: FCM 토큰 등록 (일정 알림, 가족 답장 알림)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string }
                platform: { type: string, enum: [ios, android] }
      responses:
        '204': { description: 저장됨 }

  /api/v1/agent/turn:
    post:
      tags: [agent]
      summary: 대화 한 번 (말 + 선택적으로 사진)
      description: |
        앱은 받은 speech를 읽어 주고, next에 따라 다음 동작을 합니다.
        - listen: 바로 듣기 시작
        - camera_outfit / camera_face: 카메라를 켜고 찍으면 같은 sessionId로 image와 imageKind를 보냄
        - done: 대기 화면으로
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TurnRequest' }
            examples:
              말로 시작:
                value: { utterance: "옷 검사해 줘", location: { lat: 37.5665, lon: 126.978, locationFallback: false } }
              사진 보내기:
                value: { sessionId: "s_42", imageKind: outfit, image: "<base64 JPEG>", location: { lat: 37.5665, lon: 126.978 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TurnResponse' }
              examples:
                카메라 켜기:
                  value: { sessionId: "s_42", speech: "입을 옷을 펼쳐 놓고 폰을 위에서 비춰 주세요. 준비되면 위쪽 버튼을 누르세요.", next: camera_outfit, result: null }
                옷 검사 결과:
                  value:
                    sessionId: "s_42"
                    speech: "차콜 그레이 니트와 남색 슬랙스예요. 오늘 면접에 잘 맞아요. 일교차가 11도라 옷장의 회색 자켓을 걸치면 좋겠어요. 얼룩이나 찢어진 곳은 보이지 않아요."
                    next: done
                    result:
                      type: outfit_check
                      outfitCheck:
                        garments: []
                        schedule: { ok: true, notes: [], event: { title: "면접", start: "2026-11-04T10:00:00+09:00", occasion: formal } }
                        weather: { ok: false, notes: ["일교차가 11도라 겉옷을 챙기세요."] }
                        damage: { ok: true, notes: [] }
                        retake: null
                        recommendations: [{ garmentId: c_21, name: 자켓, colorName: 회색, reason: "옷장에 있는 회색 자켓을 걸치면 면접에도 맞고 따뜻해요." }]
                        source: model
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/v1/schedules:
    get:
      tags: [schedule]
      summary: 날짜별 일정 (테스트·확인용, 평소엔 agent가 말로 처리)
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/ScheduleEvent' } }

  /api/v1/me/contacts:
    get:
      tags: [helper]
      summary: 확인을 부탁할 가족·친구 목록
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts: { type: array, items: { $ref: '#/components/schemas/Contact' } }
    post:
      tags: [helper]
      summary: 가족·친구 추가 (보호자가 대신 등록해도 됨)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Contact' }
      responses:
        '201':
          description: 추가됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }

  /api/v1/me/contacts/{contactId}:
    delete:
      tags: [helper]
      summary: 가족·친구 삭제
      parameters:
        - { name: contactId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: 삭제됨 }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }

  responses:
    Tokens:
      description: 토큰 발급
      content:
        application/json:
          schema:
            type: object
            required: [accessToken, refreshToken, expiresIn, isNewUser]
            properties:
              accessToken: { type: string }
              refreshToken: { type: string }
              expiresIn: { type: integer, example: 3600 }
              isNewUser: { type: boolean, description: true면 앱이 음성 온보딩 시작 }
    Error:
      description: 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: image_too_large }
            message: { type: string }

    Profile:
      type: object
      description: 모든 항목 null 가능 (온보딩에서 건너뛰기)
      properties:
        name: { type: string, nullable: true }
        birthDate: { type: string, format: date, nullable: true }
        gender: { type: string, nullable: true }
        job: { type: string, nullable: true }
        heightCm: { type: number, nullable: true }
        weightKg: { type: number, nullable: true }
        agentName: { type: string, nullable: true, description: null이면 온보딩 안 함 }

    Location:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number }
        lon: { type: number }
        locationFallback: { type: boolean, default: false, description: 위치 권한이 없어 서울로 보낸 경우 }

    TurnRequest:
      type: object
      properties:
        sessionId: { type: string, nullable: true, description: 첫 말이면 비움. 이어지는 대화는 받은 값 그대로 }
        utterance: { type: string, nullable: true, description: STT 결과. 사진만 보낼 때는 비움 }
        image: { type: string, format: byte, nullable: true, description: "JPEG base64, 최대 약 6MB" }
        imageKind: { type: string, enum: [outfit, face], nullable: true }
        faceLandmarks: { type: object, nullable: true, description: imageKind=face일 때 ML Kit 윤곽점 (mcp-tools.md의 landmarks) }
        location: { $ref: '#/components/schemas/Location' }

    TurnResponse:
      type: object
      required: [sessionId, speech, next]
      properties:
        sessionId: { type: string }
        speech: { type: string, description: 앱이 그대로 읽어 줄 한국어 }
        next: { type: string, enum: [listen, camera_outfit, camera_face, done] }
        result:
          nullable: true
          type: object
          description: 화면·기록용 구조화 결과. 앱은 speech만 읽어도 동작해야 함
          properties:
            type: { type: string, enum: [outfit_check, face_check, weather, schedule, helper] }
            outfitCheck: { $ref: '#/components/schemas/OutfitCheck' }

    OutfitCheck:
      type: object
      properties:
        garments: { type: array, items: { $ref: '#/components/schemas/Garment' } }
        schedule:
          type: object
          properties:
            ok: { type: boolean }
            notes: { type: array, items: { type: string } }
            event: { $ref: '#/components/schemas/ScheduleEvent' }
        weather: { $ref: '#/components/schemas/CheckPart' }
        damage: { $ref: '#/components/schemas/CheckPart' }
        retake: { type: string, nullable: true, description: "다시 찍어야 하는 이유 (어두움, 잘림)" }
        recommendations:
          type: array
          description: 옷장에서 고른 추천 (closet_search 후보 안에서만). 옷장이 비면 빈 배열
          items:
            type: object
            properties:
              garmentId: { type: string }
              name: { type: string }
              colorName: { type: string }
              reason: { type: string }
        source: { type: string, enum: [model, gemini] }

    CheckPart:
      type: object
      properties:
        ok: { type: boolean }
        notes: { type: array, items: { type: string } }

    Garment:
      type: object
      description: 앱 lib/models/garment.dart와 같은 모양. 자세한 설명은 mcp-tools.md
      required: [id, category, name, colorName, colorFamily, tone]
      properties:
        id: { type: string }
        category: { type: string, enum: [top, bottom, outer, dress, shoes, other] }
        name: { type: string }
        colorName: { type: string }
        colorFamily: { type: string, enum: [black, white, gray, navy, beige, brown, khaki, blue, red, pink, orange, yellow, green, purple, unknown] }
        tone: { type: string, enum: [light, mid, dark] }
        pattern: { type: string, nullable: true }
        material: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        formality: { type: string, enum: [formal, smart, casual, sporty, unknown] }
        defects:
          type: array
          items:
            type: object
            required: [kind, confidence]
            properties:
              kind: { type: string, enum: [stain, tear, lint, other] }
              where: { type: string, nullable: true, description: 입은 사람 기준 왼쪽·오른쪽 }
              confidence: { type: number }
        box:
          type: object
          nullable: true
          properties: { x: { type: number }, y: { type: number }, w: { type: number }, h: { type: number } }
        confidence: { type: number }

    ScheduleEvent:
      type: object
      nullable: true
      properties:
        eventId: { type: string }
        title: { type: string }
        start: { type: string, format: date-time }
        place: { type: string, nullable: true }
        occasion: { type: string, enum: [mourning, wedding, formal, business, active, casual] }

    Contact:
      type: object
      required: [name, phone]
      properties:
        contactId: { type: string, readOnly: true }
        name: { type: string, example: 엄마 }
        phone: { type: string, example: "010-0000-0000", writeOnly: true, description: 응답에는 내보내지 않음 }
        relation: { type: string, nullable: true, example: 가족 }
