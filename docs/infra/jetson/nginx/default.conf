# Tailscale Funnel → 127.0.0.1:80 → gateway:8080
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 젯슨 자신, Docker 내부, 사설망(학원 내부망의 Nginx Proxy Manager)만 허용
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 100.64.0.0/10;   # Tailscale
    deny all;

    # real_ip(X-Forwarded-For)는 쓰지 않음: 쓰면 Funnel로 온 요청이 바깥 IP로 바뀌어 위 allow에 걸려 403이 됨.
    # 원래 클라이언트 IP는 X-Forwarded-For 헤더로 gateway까지 그대로 전달됨.

    # 옷·얼굴 사진 업로드
    client_max_body_size 20m;

    # gateway 컨테이너가 다시 떠서 IP가 바뀌어도 따라가게 Docker DNS로 매번 찾음
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8080;

    location / {
        proxy_pass $gateway;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # Funnel·NPM이 TLS를 끝내고 들어옴
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket / SSE
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;

        # GPT 응답을 기다릴 수 있게 넉넉히
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }
}
