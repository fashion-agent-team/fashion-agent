# 젯슨(team4)에 서버 8개 + PostgreSQL + Redis + nginx를 한 번에 띄웁니다.
# 젯슨 폴더 구조(scripts/sync.sh가 맞춰 줌):
#   ~/fashion-servers/<레포 8개>/        build context
#   ~/fashion-servers/jetson-deploy/     이 파일, .env
#   ~/fashion-servers/models/            FashionSigLIP ONNX
# 밖으로 여는 포트는 nginx 127.0.0.1:80 하나. Tailscale Funnel이 여기로 프록시합니다.
# 메모리 상한 합계 약 3.5GB (README.md 표). 값은 docker stats 보고 조정.
name: fashion-agent

x-app: &app
  restart: unless-stopped
  networks: [fashion]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

# JVM 공통: SerialGC(스레드·메모리 적게), C1만(코드 캐시 작게), OOM이면 바로 죽고 restart로 다시 뜸.
# 서비스마다 JAVA_TOOL_OPTIONS 앞에 -Xmx, -XX:MaxMetaspaceSize만 다르게 붙임.

services:
  postgres:
    <<: *app
    image: pgvector/pgvector:pg17
    mem_limit: 128m
    environment:
      POSTGRES_DB: fashion
      POSTGRES_USER: fashion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD 필요}
      TZ: Asia/Seoul
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=40", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=32MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashion -d fashion"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    <<: *app
    image: redis:7-alpine
    mem_limit: 48m
    # 세션의 사진이 디스크에 남지 않게 저장 끔
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  nginx:
    <<: *app
    image: nginx:1.27-alpine
    mem_limit: 32m
    # 127.0.0.1(Funnel·cloudflared)과 학원 내부망(강사님 서버 Nginx Proxy Manager → 젯슨 내부 IP:80).
    # 누가 들어올 수 있는지는 nginx/default.conf의 allow 목록으로 제한
    ports: ["80:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [gateway]

  gateway:
    <<: *app
    build: ../fashion-agent-gateway
    image: fashion-agent/gateway:local
    mem_limit: 320m
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Xmx128m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=32m -Xss512k -XX:+ExitOnOutOfMemoryError"
      SPRING_PROFILES_ACTIVE: dev          # 맥북과 같게: 개발용 로그인 켬
      GATEWAY_DEV_LOGIN: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fashion
      SPRING_DATASOURCE_USERNAME: fashion
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "3"
      JWT_SECRET: ${JWT_SECRET:?.env에 JWT_SECRET 필요}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AGENT_URL: http://agent:8081
      HELPER_URL: http://mcp-helper:8096
      SCHEDULE_URL: http://mcp-schedule:8092
      EDGE_TTS_URL: http://edge-tts:8099   # 엣지 목소리(선희). 키 없음, 발표용
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-koreacentral}
    healthcheck: &health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s     # 젯슨은 처음 뜰 때 느림
    depends_on:
      postgres: { condition: service_healthy }

  # 엣지 목소리 사이드카(2026-11-12, 발표용·비공식). 파이썬 edge-tts, 키 없음, 밖에 안 엶.
  # 꺼져 있거나 막혀도 gateway가 502를 주고 앱은 아이폰 목소리로 읽음.
  edge-tts:
    <<: *app
    build: ../fashion-agent-gateway/edge-tts
    image: fashion-agent/edge-tts:local
    mem_limit: 96m

  agent:
    <<: *app
    build: ../fashion-agent-agent
    image: fashion-agent/agent:local
    mem_limit: 352m
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Xmx144m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=32m -Xss512k -XX:+ExitOnOutOfMemoryError"
      # 맥북은 mcp,openai(세션 메모리 보관). 여기서는 Redis를 붙여 세션을 Redis에 둠.
      SPRING_PROFILES_ACTIVE: mcp,openai,redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OPENAI_API_KEY: ${OPENAI_API_KEY:?.env에 OPENAI_API_KEY 필요}
      AGENT_OPENAI_MODEL: ${AGENT_OPENAI_MODEL:-gpt-5.4-mini}
      AGENT_OPENAI_REASONING: ${AGENT_OPENAI_REASONING:-none}
      MCP_WEATHER_URL: http://mcp-weather:8091/mcp
      MCP_SCHEDULE_URL: http://mcp-schedule:8092/mcp
      MCP_CLOTHES_STATE_URL: http://mcp-clothes-state:8093/mcp
      MCP_FACE_CHECK_URL: http://mcp-face-check:8094/mcp
      MCP_CLOSET_URL: http://mcp-closet:8095/mcp
      MCP_HELPER_URL: http://mcp-helper:8096/mcp
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
    depends_on:
      redis: { condition: service_healthy }
      mcp-weather: { condition: service_healthy }
      mcp-schedule: { condition: service_healthy }
      mcp-clothes-state: { condition: service_healthy }
      mcp-face-check: { condition: service_healthy }
      mcp-closet: { condition: service_healthy }
      mcp-helper: { condition: service_healthy }

  mcp-weather:
    <<: *app
    build: ../mcp-weather
    image: fashion-agent/mcp-weather:local
    mem_limit: 256m
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Xmx112m -XX:MaxMetaspaceSize=112m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=32m -Xss512k -XX:+ExitOnOutOfMemoryError"
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8091/actuator/health || exit 1"]

  mcp-schedule:
    <<: *app
    build: ../mcp-schedule
    image: fashion-agent/mcp-schedule:local
    mem_limit: 288m
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Xmx112m -XX:MaxMetaspaceSize=112m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=32m -Xss512k -XX:+ExitOnOutOfMemoryError"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fashion
      SPRING_DATASOURCE_USERNAME: fashion
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "3"
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8092/actuator/health || exit 1"]
    depends_on:
      postgres: { condition: service_healthy }

  mcp-clothes-state:
    <<: *app
    build: ../mcp-clothes-state
    image: fashion-agent/mcp-clothes-state:local
    # FashionSigLIP(354MB ONNX)를 켜면 네이티브 메모리가 약 400MB 더 듭니다.
    # 메모리가 모자라면 .env에서 CLOTHES_EMBED_MODEL= 로 비우고 mem_limit을 512m로 내리세요(embedding 없이 응답).
    mem_limit: 832m
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Xmx160m -XX:MaxMetaspaceSize=112m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=32m -Xss512k -XX:+ExitOnOutOfMemoryError"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLOTHES_EMBED_MODEL: ${CLOTHES_EMBED_MODEL:-}
      CLOTHES_CANDIDATE_DIR: /app/data/train-candidates
    volumes:
      - ../models:/models:ro
      - clothes-candidates:/app/data
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8093/actuator/health || exit 1"]
    depends_on:
      volume-init: { condition: service_completed_successfully }

  mcp-face-check:
    <<: *app
    build: ../mcp-face-check
    image: fashion-agent/mcp-face-check:local
    mem_limit: 512m
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=112m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=32m -Xss512k -XX:+ExitOnOutOfMemoryError"
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8094/actuator/health || exit 1"]

  mcp-closet:
    <<: *app
    build: ../mcp-closet
    image: fashion-agent/mcp-closet:local
    # PR #9부터 FashionSigLIP 글 모델(int8 ~111MB)로 imageQuery를 켬. 문서상 서버 메모리 약 1.1GB
    mem_limit: 1200m
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Xmx128m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=32m -Xss512k -XX:+ExitOnOutOfMemoryError"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fashion
      SPRING_DATASOURCE_USERNAME: fashion
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "3"
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8095/actuator/health || exit 1"]
    depends_on:
      postgres: { condition: service_healthy }

  mcp-helper:
    <<: *app
    build: ../mcp-helper
    image: fashion-agent/mcp-helper:local
    mem_limit: 256m
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Xmx112m -XX:MaxMetaspaceSize=112m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=32m -Xss512k -XX:+ExitOnOutOfMemoryError"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fashion
      SPRING_DATASOURCE_USERNAME: fashion
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "3"
      # 가족 답장 링크 도메인. 게이트웨이 /h/** 가 helper로 감.
      HELPER_PUBLIC_BASE_URL: ${HELPER_PUBLIC_BASE_URL:-https://simcheong.java21.net}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_API_SECRET: ${SMS_API_SECRET:-}
      SMS_SENDER: ${SMS_SENDER:-}
      SMS_SERVICE_ID: ${SMS_SERVICE_ID:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-fashion-agent-helper}
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8096/actuator/health || exit 1"]
    depends_on:
      postgres: { condition: service_healthy }

  # Cloudflare Tunnel (simcheong.java21.net 등). .env에 CLOUDFLARE_TUNNEL_TOKEN을 넣고
  #   docker compose --profile tunnel up -d cloudflared
  # Cloudflare Public Hostname의 Service는 http://nginx:80
  cloudflared:
    <<: *app
    image: cloudflare/cloudflared:2025.11.1
    profiles: [tunnel]
    mem_limit: 64m
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [nginx]

  # clothes-state는 USER 1000으로 돌아서, 새 볼륨의 주인을 1000으로 바꿔 둠(한 번 돌고 끝남)
  volume-init:
    image: redis:7-alpine
    restart: "no"
    command: ["chown", "-R", "1000:1000", "/data/clothes"]
    volumes:
      - clothes-candidates:/data/clothes
    networks: [fashion]

networks:
  fashion: {}

volumes:
  pgdata: {}
  clothes-candidates: {}
